<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hashline — hash generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0E1013;
    --surface: #161920;
    --surface-2: #1D212A;
    --border: #2A2F3A;
    --text: #E7E9ED;
    --text-dim: #8A8F9C;
    --accent: #57D9C4;
    --accent-dim: #2E5C55;
    --warn: #E8A33D;
    --mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
    --sans: 'Inter', system-ui, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #F5F6F8; --surface: #FFFFFF; --surface-2: #F0F1F4;
      --border: #DDE0E6; --text: #14161A; --text-dim: #6A6F7B;
      --accent: #0E8E7A; --accent-dim: #C9F0E9;
    }
  }
  :root[data-theme="light"] {
    --bg: #F5F6F8; --surface: #FFFFFF; --surface-2: #F0F1F4;
    --border: #DDE0E6; --text: #14161A; --text-dim: #6A6F7B;
    --accent: #0E8E7A; --accent-dim: #C9F0E9;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--sans); min-height: 100%;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 48px 20px 80px; }
  header { margin-bottom: 32px; display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  h1 { font-size: 28px; font-weight: 700; margin: 0 0 6px; letter-spacing: -0.02em; }
  header p { margin: 0; color: var(--text-dim); font-size: 14.5px; max-width: 46ch; line-height: 1.5; }
  .theme-toggle {
    background: var(--surface); border: 1px solid var(--border); color: var(--text-dim);
    border-radius: 8px; padding: 7px 11px; font-size: 12.5px; font-family: var(--sans);
    cursor: pointer; flex-shrink: 0;
  }
  .theme-toggle:hover { color: var(--text); border-color: var(--accent); }

  .tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
  .tab {
    background: transparent; border: none; color: var(--text-dim); font-family: var(--sans);
    font-size: 14px; font-weight: 500; padding: 10px 4px; margin-right: 20px; cursor: pointer;
    border-bottom: 2px solid transparent; position: relative; top: 1px;
  }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); }

  .panel { display: none; }
  .panel.active { display: block; }

  textarea {
    width: 100%; min-height: 140px; background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px;
    font-family: var(--mono); font-size: 13.5px; line-height: 1.6; resize: vertical;
  }
  textarea:focus, .dropzone:focus-visible, .algo input:focus-visible + span, .theme-toggle:focus-visible, .copy-btn:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  .dropzone {
    border: 1.5px dashed var(--border); border-radius: 10px; padding: 28px 16px;
    text-align: center; color: var(--text-dim); font-size: 13.5px; cursor: pointer;
    background: var(--surface);
  }
  .dropzone.drag { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
  .dropzone strong { color: var(--text); font-weight: 600; }
  .file-info { margin-top: 10px; font-size: 13px; color: var(--text-dim); font-family: var(--mono); word-break: break-all; }
  #fileInput { display: none; }

  .algo-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 22px; }
  .algo { position: relative; }
  .algo input { position: absolute; opacity: 0; width: 0; height: 0; }
  .algo span {
    display: inline-block; padding: 7px 13px; border-radius: 20px; border: 1px solid var(--border);
    font-family: var(--mono); font-size: 12.5px; color: var(--text-dim); cursor: pointer;
    background: var(--surface); user-select: none;
  }
  .algo input:checked + span { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }

  .results { display: flex; flex-direction: column; gap: 10px; }
  .result-row {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px;
  }
  .result-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .result-label { font-size: 11.5px; font-weight: 600; color: var(--text-dim); letter-spacing: 0.02em; }
  .copy-btn {
    background: transparent; border: 1px solid var(--border); color: var(--text-dim);
    font-family: var(--sans); font-size: 11.5px; padding: 4px 9px; border-radius: 6px; cursor: pointer;
  }
  .copy-btn:hover { border-color: var(--accent); color: var(--accent); }
  .copy-btn.done { border-color: var(--accent); color: var(--accent); }
  .result-value {
    font-family: var(--mono); font-size: 13px; word-break: break-all; line-height: 1.5; color: var(--text);
  }
  .empty { color: var(--text-dim); font-size: 13.5px; padding: 20px 0; }

  footer { margin-top: 40px; color: var(--text-dim); font-size: 12px; line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Hashline_by_Abhishek</h1>
      <p>Type text or drop a file. Everything is hashed locally in your browser — nothing leaves this page.</p>
    </div>
    <button class="theme-toggle" id="themeToggle" type="button">Dark</button>
  </header>

  <div class="tabs">
    <button class="tab active" data-panel="text">Text</button>
    <button class="tab" data-panel="file">File</button>
  </div>

  <div class="panel active" id="panel-text">
    <textarea id="textInput" placeholder="Type or paste text here…" spellcheck="false"></textarea>
  </div>

  <div class="panel" id="panel-file">
    <div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="Choose a file to hash">
      <div><strong>Drop a file</strong> or click to choose one</div>
      <div class="file-info" id="fileInfo"></div>
    </div>
    <input type="file" id="fileInput">
  </div>

  <div class="algo-row" id="algoRow"></div>

  <div class="results" id="results"></div>

  <footer>Hashes are computed with the Web Crypto API (SHA-1/256/384/512) and a local MD5 implementation. Nothing is uploaded or stored.</footer>
</div>

<script>
// ---------- MD5 (pure JS, since Web Crypto doesn't provide it) ----------
function md5(input) {
  function rotl(x, c) { return (x << c) | (x >>> (32 - c)); }
  function toBytesUTF8(str) { return new TextEncoder().encode(str); }
  const s = [7,12,17,22,7,12,17,22,7,12,17,22,7,12,17,22,
             5,9,14,20,5,9,14,20,5,9,14,20,5,9,14,20,
             4,11,16,23,4,11,16,23,4,11,16,23,4,11,16,23,
             6,10,15,21,6,10,15,21,6,10,15,21,6,10,15,21];
  const K = new Int32Array(64);
  for (let i = 0; i < 64; i++) K[i] = (Math.floor(Math.abs(Math.sin(i + 1)) * 2**32)) | 0;

  let bytes = input instanceof Uint8Array ? input : toBytesUTF8(input);
  const origLenBits = bytes.length * 8;
  const withOne = new Uint8Array(((bytes.length + 8) >> 6) * 64 + 64);
  withOne.set(bytes);
  withOne[bytes.length] = 0x80;
  const dv = new DataView(withOne.buffer);
  dv.setUint32(withOne.length - 8, origLenBits >>> 0, true);
  dv.setUint32(withOne.length - 4, Math.floor(origLenBits / 4294967296), true);

  let a0 = 0x67452301, b0 = 0xefcdab89, c0 = 0x98badcfe, d0 = 0x10325476;

  for (let chunk = 0; chunk < withOne.length; chunk += 64) {
    const M = new Int32Array(16);
    for (let j = 0; j < 16; j++) M[j] = dv.getInt32(chunk + j * 4, true);
    let A = a0, B = b0, C = c0, D = d0;
    for (let i = 0; i < 64; i++) {
      let F, g;
      if (i < 16) { F = (B & C) | (~B & D); g = i; }
      else if (i < 32) { F = (D & B) | (~D & C); g = (5 * i + 1) % 16; }
      else if (i < 48) { F = B ^ C ^ D; g = (3 * i + 5) % 16; }
      else { F = C ^ (B | ~D); g = (7 * i) % 16; }
      F = (F + A + K[i] + M[g]) | 0;
      A = D; D = C; C = B;
      B = (B + rotl(F, s[i])) | 0;
    }
    a0 = (a0 + A) | 0; b0 = (b0 + B) | 0; c0 = (c0 + C) | 0; d0 = (d0 + D) | 0;
  }

  function toHexLE(n) {
    const buf = new ArrayBuffer(4);
    new DataView(buf).setInt32(0, n, true);
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  }
  return toHexLE(a0) + toHexLE(b0) + toHexLE(c0) + toHexLE(d0);
}

// ---------- Web Crypto digests ----------
async function webCryptoHash(algo, data) {
  const buf = await crypto.subtle.digest(algo, data);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

const ALGOS = [
  { id: 'md5',    label: 'MD5' },
  { id: 'sha1',   label: 'SHA-1',   wc: 'SHA-1' },
  { id: 'sha256', label: 'SHA-256', wc: 'SHA-256' },
  { id: 'sha384', label: 'SHA-384', wc: 'SHA-384' },
  { id: 'sha512', label: 'SHA-512', wc: 'SHA-512' },
];
const enabled = new Set(['md5', 'sha1', 'sha256']);

const algoRow = document.getElementById('algoRow');
ALGOS.forEach(a => {
  const label = document.createElement('label');
  label.className = 'algo';
  label.innerHTML = `<input type="checkbox" value="${a.id}" ${enabled.has(a.id) ? 'checked' : ''}><span>${a.label}</span>`;
  label.querySelector('input').addEventListener('change', e => {
    e.target.checked ? enabled.add(a.id) : enabled.delete(a.id);
    compute();
  });
  algoRow.appendChild(label);
});

const resultsEl = document.getElementById('results');
const textInput = document.getElementById('textInput');
let currentFile = null;

function renderEmpty(msg) {
  resultsEl.innerHTML = `<div class="empty">${msg}</div>`;
}

async function compute() {
  const activeTab = document.querySelector('.tab.active').dataset.panel;
  let data;
  if (activeTab === 'text') {
    const text = textInput.value;
    if (!text) return renderEmpty('Hashes will appear here as you type.');
    data = new TextEncoder().encode(text);
  } else {
    if (!currentFile) return renderEmpty('Choose a file to see its hashes.');
    data = new Uint8Array(await currentFile.arrayBuffer());
  }
  if (enabled.size === 0) return renderEmpty('Pick at least one algorithm above.');

  resultsEl.innerHTML = '';
  for (const a of ALGOS) {
    if (!enabled.has(a.id)) continue;
    const value = a.id === 'md5' ? md5(data) : await webCryptoHash(a.wc, data);
    const row = document.createElement('div');
    row.className = 'result-row';
    row.innerHTML = `
      <div class="result-head">
        <span class="result-label">${a.label}</span>
        <button class="copy-btn" type="button">Copy</button>
      </div>
      <div class="result-value">${value}</div>`;
    row.querySelector('.copy-btn').addEventListener('click', async (e) => {
      try {
        await navigator.clipboard.writeText(value);
        e.target.textContent = 'Copied';
        e.target.classList.add('done');
        setTimeout(() => { e.target.textContent = 'Copy'; e.target.classList.remove('done'); }, 1200);
      } catch (err) { /* clipboard unavailable, ignore */ }
    });
    resultsEl.appendChild(row);
  }
}

textInput.addEventListener('input', compute);

// ---------- tabs ----------
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-' + tab.dataset.panel).classList.add('active');
    compute();
  });
});

// ---------- file handling ----------
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const fileInfo = document.getElementById('fileInfo');

function setFile(f) {
  currentFile = f;
  fileInfo.textContent = `${f.name} — ${(f.size / 1024).toFixed(1)} KB`;
  compute();
}
dropzone.addEventListener('click', () => fileInput.click());
dropzone.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') fileInput.click(); });
fileInput.addEventListener('change', () => { if (fileInput.files[0]) setFile(fileInput.files[0]); });
['dragover', 'dragenter'].forEach(evt => dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.add('drag'); }));
['dragleave', 'drop'].forEach(evt => dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.remove('drag'); }));
dropzone.addEventListener('drop', e => { if (e.dataTransfer.files[0]) setFile(e.dataTransfer.files[0]); });

// ---------- theme ----------
const themeToggle = document.getElementById('themeToggle');
let theme = 'dark';
document.documentElement.setAttribute('data-theme', theme);
themeToggle.textContent = 'Dark';
themeToggle.addEventListener('click', () => {
  theme = theme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', theme);
  themeToggle.textContent = theme === 'dark' ? 'Dark' : 'Light';
});

renderEmpty('Hashes will appear here as you type.');
</script>
</body>
</html>
